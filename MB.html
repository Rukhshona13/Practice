<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Furniture Page</title>
  <link rel="stylesheet" href="./src/output.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>
<body class="bg-[#f5f5f5] font-serif">

  <div class="max-w-[1200px] mx-auto px-8 py-10">
    <div class="grid grid-cols-[220px_1fr] gap-16">
      <aside class="pt-8">
        <input
          type="text"
          placeholder="search..."
          class="w-full border border-gray-400 bg-transparent px-4 py-2 text-sm outline-none"
        />

        <h2 class="mt-10 text-[20px] font-bold text-black">Company</h2>

        <ul class="mt-4 space-y-2 text-[18px] text-gray-500">
          <li><a href="#" class="hover:text-black">All</a></li>
          <li><a href="#" class="hover:text-black">Ikea</a></li>
          <li><a href="#" class="hover:text-black">Marcos</a></li>
          <li><a href="#" class="hover:text-black">Caressa</a></li>
          <li><a href="#" class="hover:text-black">Liddy</a></li>
        </ul>
      </aside>

      <main>
        <div class="flex justify-end mb-8">
          <button class="border border-indigo-500 text-indigo-500 px-6 py-2 rounded-xl text-[18px] hover:bg-indigo-500 hover:text-white transition">
            Add New +
          </button>
        </div>

        <div class="grid grid-cols-3 gap-x-6 gap-y-10">
          <div>
            <div class="rounded overflow-hidden">
              <img
                src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600"
                alt="bed"
                class="w-full h-[190px] object-cover"
              />
            </div>

            <div class="bg-green-600 text-white text-center py-2 text-[18px]">
              эта уже купить
            </div>

            <h3 class="mt-3 text-center text-[18px] font-bold text-red-700 line-through">
              Emperor Sofa
            </h3>

            <div class="mt-2 flex items-center justify-between px-6 text-[24px]">
              <div class="flex items-center gap-4">
                <i class="fa-solid fa-trash text-red-600 cursor-pointer"></i>
                <i class="fa-regular fa-pen-to-square text-black cursor-pointer"></i>
              </div>

              <p class="text-[18px] font-bold text-black">99.99</p>

              <div class="flex items-center gap-4">
                <input type="checkbox" checked class="w-4 h-4 accent-blue-500" />
                <i class="fa-regular fa-circle-info text-gray-500 cursor-pointer"></i>
              </div>
            </div>
          </div>
          <div>
            <div class="rounded overflow-hidden">
              <img
                src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=601"
                alt="bed"
                class="w-full h-[190px] object-cover"
              />
            </div>

            <h3 class="mt-3 text-center text-[18px] font-bold text-black">
              Invironment Bed
            </h3>

            <div class="mt-2 flex items-center justify-between px-6 text-[24px]">
              <div class="flex items-center gap-4">
                <i class="fa-solid fa-trash text-red-600 cursor-pointer"></i>
                <i class="fa-regular fa-pen-to-square text-black cursor-pointer"></i>
              </div>

              <p class="text-[18px] font-bold text-black">69.99</p>

              <div class="flex items-center gap-4">
                <input type="checkbox" class="w-4 h-4" />
                <i class="fa-regular fa-circle-info text-gray-500 cursor-pointer"></i>
              </div>
            </div>
          </div>
          <div>
            <div class="rounded overflow-hidden">
              <img
                src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=602"
                alt="bed"
                class="w-full h-[190px] object-cover"
              />
            </div>

            <h3 class="mt-3 text-center text-[18px] font-bold text-black">
              Sofa Set
            </h3>

            <div class="mt-2 flex items-center justify-between px-6 text-[24px]">
              <div class="flex items-center gap-4">
                <i class="fa-solid fa-trash text-red-600 cursor-pointer"></i>
                <i class="fa-regular fa-pen-to-square text-black cursor-pointer"></i>
              </div>

              <p class="text-[18px] font-bold text-black">69.99</p>

              <div class="flex items-center gap-4">
                <input type="checkbox" class="w-4 h-4" />
                <i class="fa-regular fa-circle-info text-gray-500 cursor-pointer"></i>
              </div>
            </div>
          </div>
          <div>
            <div class="rounded overflow-hidden">
              <img
                src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=603"
                alt="chair"
                class="w-full h-[190px] object-cover"
              />
            </div>

            <h3 class="mt-3 text-center text-[18px] font-bold text-black">
              Chais Bed
            </h3>

            <div class="mt-2 flex items-center justify-between px-6 text-[24px]">
              <div class="flex items-center gap-4">
                <i class="fa-solid fa-trash text-red-600 cursor-pointer"></i>
                <i class="fa-regular fa-pen-to-square text-black cursor-pointer"></i>
              </div>

              <p class="text-[18px] font-bold text-black">109.99</p>

              <div class="flex items-center gap-4">
                <input type="checkbox" class="w-4 h-4" />
                <i class="fa-regular fa-circle-info text-gray-500 cursor-pointer"></i>
              </div>
            </div>
          </div>
          <div>
            <div class="rounded overflow-hidden">
              <img
                src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=604"
                alt="room"
                class="w-full h-[190px] object-cover"
              />
            </div>

            <h3 class="mt-3 text-center text-[18px] font-bold text-black">
              Sofa Bed
            </h3>

            <div class="mt-2 flex items-center justify-between px-6 text-[24px]">
              <div class="flex items-center gap-4">
                <i class="fa-solid fa-trash text-red-600 cursor-pointer"></i>
                <i class="fa-regular fa-pen-to-square text-black cursor-pointer"></i>
              </div>

              <p class="text-[18px] font-bold text-black">100.00</p>

              <div class="flex items-center gap-4">
                <input type="checkbox" class="w-4 h-4" />
                <i class="fa-regular fa-circle-info text-gray-500 cursor-pointer"></i>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

</body>
</html>
